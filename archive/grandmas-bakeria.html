<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandma's Bakeria</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#35192e;--plum:#6b2d5c;--berry:#a63d6f;--butter:#f7d774;--pist:#b5d3a4;--paper:#fbf7fb;--line:#e6d9e3;--warn:#c2410c;--ok:#2f7a4b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Young Serif',Georgia,serif;font-weight:400;margin:0}
h2{font-size:22px;margin-bottom:10px}.mini{font-size:16px;margin:16px 0 4px}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 24px;background:var(--ink)}
.top h1{font-size:22px;color:var(--butter)}.tabs{display:flex;gap:6px}
.tabs a{color:#fff;text-decoration:none;padding:8px 16px;border-radius:99px;border:1px solid #ffffff44}
.tabs a.on{background:var(--butter);color:var(--ink);border-color:var(--butter);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:24px}
.lead{font-size:30px;margin-bottom:4px}.sub{color:#6e5668;margin:0 0 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{padding:6px 14px;border-radius:99px;border:1.5px solid var(--plum);background:#fff;color:var(--plum)}
.chip.on{background:var(--plum);color:#fff}
.layout{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
@media(max-width:820px){.layout,.cols{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.item,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:14px}
.item{overflow:hidden;display:flex;flex-direction:column}
.pic{height:96px;display:grid;place-items:center;font-size:48px}
.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:700}.ing{font-size:13px;color:#6e5668;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:#f6e3ee;color:var(--plum)}.tag.free{background:#e3f1db;color:var(--ok)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--plum);color:#fff;font-weight:700}
.btn:hover{background:var(--berry)}.btn:disabled{background:#cdbfc9;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--plum);border:1.5px solid var(--plum)}.btn.sm{padding:6px 10px;font-size:14px}.full{width:100%}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--plum);background:#fff;color:var(--plum);font-weight:700}
.qty button:disabled{opacity:.4}
.panel{padding:18px}.cart{position:sticky;top:16px}
input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;margin:6px 0 10px}
.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.total{font-weight:700;font-size:18px;margin:10px 0}.empty{color:#8a7684}
.confirm{background:var(--butter);text-align:center}.confirm .num{font-family:'Young Serif',serif;font-size:56px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{padding:16px;font-size:14px}.stat b{display:block;font-family:'Young Serif',serif;font-size:28px;font-weight:400}
.stat.save{background:var(--pist);border-color:var(--pist)}
.alert{background:#fff1e6;border:1.5px solid var(--warn);color:var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-weight:500}
.order{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.order.done{opacity:.5}.order.late{border-left:4px solid var(--warn);padding-left:10px}
.order small{display:block;color:#6e5668}
.bar{height:10px;background:#efe3ec;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}.bar i.low{background:var(--warn)}
.inv{margin-bottom:12px}.low-t{color:var(--warn);font-weight:700}
.bs{display:grid;grid-template-columns:140px 1fr 30px;gap:10px;align-items:center;margin:8px 0}
.bs .bar{margin:0;height:14px}.bs .bar i{background:var(--berry)}
.qrrow{display:flex;gap:20px;flex-wrap:wrap}.qrrow>div:last-child{flex:1;min-width:240px}
#qr{padding:8px;background:#fff;border:1px solid var(--line);border-radius:10px;align-self:flex-start;min-width:60px}
.tools{display:flex;gap:10px;flex-wrap:wrap}.note{font-size:13px;color:#6e5668}
@media(prefers-reduced-motion:no-preference){.confirm{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.94);opacity:0}}}
</style>
</head>
<body>
<header class="top">
  <h1>Grandma's Bakeria</h1>
  <nav class="tabs" aria-label="Views"><a href="#/" id="t-c">Customer menu</a><a href="#/grandma" id="t-g">Grandma's dashboard</a></nav>
</header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------- Data (edit freely) ---------- */
const MENU=[
 {id:'parfait',name:'Fall Parfait',price:7.5,e:'🍂',bg:'#f7d774',ing:'Vanilla yogurt, spiced apples, maple granola, pumpkin swirl',al:['dairy','gluten','nuts'],r:{yogurt:120,granola:40,apples:60,pumpkin:20,pecans:5}},
 {id:'donut',name:'Apple Cider Donut',price:3.25,e:'🍩',bg:'#f2b8a2',ing:'Flour, apple cider, butter, sugar, eggs, cinnamon',al:['gluten','dairy','eggs'],r:{flour:70,apples:20,butter:20,sugar:25,eggs:0.5}},
 {id:'loaf',name:'Pumpkin Loaf Slice',price:4,e:'🎃',bg:'#f5c48a',ing:'Flour, pumpkin purée, sugar, eggs, butter, pecans',al:['gluten','dairy','eggs','nuts'],r:{flour:60,pumpkin:50,sugar:25,eggs:0.5,butter:15,pecans:8}},
 {id:'croissant',name:'Almond Croissant',price:4.75,e:'🥐',bg:'#e9d3a8',ing:'Flour, butter, almonds, sugar, eggs',al:['gluten','dairy','nuts','eggs'],r:{flour:60,butter:35,almonds:20,sugar:10,eggs:0.3}},
 {id:'scone',name:'Maple Pecan Scone',price:3.75,e:'🥧',bg:'#d9b99b',ing:'Flour, butter, pecans, maple sugar, eggs',al:['gluten','dairy','nuts','eggs'],r:{flour:80,butter:30,pecans:15,sugar:15,eggs:0.3}},
 {id:'applecup',name:'Baked Apple Cup',price:3.5,e:'🍎',bg:'#b5d3a4',ing:'Apples, brown sugar, cinnamon, oat crumble',al:['gluten'],r:{apples:150,sugar:15,flour:15}}
];
const ALLERGENS=['nuts','dairy','gluten','eggs'];
const ING={yogurt:['Yogurt','g',6000],granola:['Granola','g',2500],apples:['Apples','g',6000],pumpkin:['Pumpkin purée','g',3000],pecans:['Pecans','g',800],flour:['Flour','g',9000],butter:['Butter','g',3000],sugar:['Sugar','g',3500],eggs:['Eggs','',60],almonds:['Almonds','g',700]};
const LOW=.25; // an ingredient is "low" at 25% of a full stock
const MIN_PER_ORDER=2, WAGE=18, WASTE_RATE=0.04; // savings assumptions
const NAMES=['Maya','Sam','Priya','Leo','Jo','Alex','Nina','Table 4','Table 7'];
 
/* ---------- State: saved in this browser, so two tabs stay in sync ---------- */
const KEY='bakeria-full-v1';
const rnd=(a,b)=>a+Math.random()*(b-a);
const item=id=>MENU.find(m=>m.id===id);
const money=n=>'$'+Number(n).toFixed(2);
const fresh=()=>{const inv={};for(const k in ING)inv[k]=ING[k][2];return{orders:[],inv,seq:1000}};
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}return S}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function seedHistory(){
  const now=Date.now();S=fresh();
  for(let d=13;d>=0;d--){
    const day=new Date(now-d*864e5),wk=[0,6].includes(day.getDay());
    const n=Math.round(rnd(14,24)*(wk?1.5:1)*(1+(13-d)*.02)); // slow upward trend
    for(let i=0;i<n;i++){
      let h=Math.round((rnd(7,17)+rnd(7,17))/2);if(d===0)h=Math.min(h,new Date().getHours());
      const t=new Date(day);t.setHours(h,Math.floor(rnd(0,60)),0,0);if(+t>now)continue;
      const its={};for(let j=Math.ceil(rnd(0,3));j>0;j--){const m=Math.random()<.3?MENU[0]:MENU[Math.floor(rnd(0,MENU.length))];its[m.id]=(its[m.id]||0)+1}
      const total=Object.entries(its).reduce((s,[k,q])=>s+item(k).price*q,0);
      S.orders.push({name:NAMES[i%NAMES.length],items:its,total,t:+t,done:now-t>15*60e3});
    }
  }
  S.orders.sort((a,b)=>a.t-b.t).forEach(o=>o.id=++S.seq);
  for(const k in ING)S.inv[k]=ING[k][2]*({pecans:.2,granola:.22}[k]??rnd(.4,.9)); // two low items for the demo
  save();
}
if(!load())seedHistory();
 
let cart={},hide=[],name='',last=null,days=7,addr=location.href.split('#')[0]+'#/';
const $=s=>document.querySelector(s);
const canMake=(m,q=1)=>Object.entries(m.r).every(([k,v])=>S.inv[k]>=v*q);
const hr12=h=>(h%12||12)+(h<12?'a':'p');
const dkey=t=>new Date(t).toLocaleDateString('en-CA');
const ago=t=>Math.max(0,Math.round((Date.now()-t)/60000));
 
/* ---------- Actions ---------- */
function toggleHide(a){hide=hide.includes(a)?hide.filter(x=>x!==a):[...hide,a];render()}
function add(id,d){const n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(canMake(item(id),n))cart[id]=n;render()}
function place(){
  const ids=Object.keys(cart);if(!ids.length)return;
  load();
  if(!ids.every(i=>canMake(item(i),cart[i]))){alert('Something just sold out. Please check the menu.');cart={};return render()}
  ids.forEach(i=>{for(const k in item(i).r)S.inv[k]=Math.max(0,S.inv[k]-item(i).r[k]*cart[i])});
  const o={id:++S.seq,name:name.trim()||'Guest',items:{...cart},total:ids.reduce((t,i)=>t+item(i).price*cart[i],0),t:Date.now(),done:false};
  S.orders.push(o);save();last=o;cart={};render();
}
function setDone(id,v){load();S.orders.find(o=>o.id===id).done=v;save();render()}
function restock(k){load();S.inv[k]=ING[k][2];save();render()}
function setDays(d){days=d;render()}
function sample(){seedHistory();render()}
function clearAll(){S=fresh();save();render()}
 
/* ---------- Charts (plain SVG, no libraries) ---------- */
function areaChart(s){
  const W=600,H=220,L=46,B=26,T=10,R=10,mx=Math.max(10,...s.map(d=>d.rev));
  const y=v=>T+(H-T-B)*(1-v/mx),x=i=>L+(W-L-R)*(s.length>1?i/(s.length-1):.5),pts=s.map((d,i)=>x(i)+','+y(d.rev)).join(' ');
  const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="#eadfe7"/><text x="${L-6}" y="${y(mx*f)+4}" text-anchor="end" font-size="11" fill="#6e5668">$${Math.round(mx*f)}</text>`).join('');
  const step=Math.ceil(s.length/7);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales per day" style="width:100%">${grid}
  <polygon points="${x(0)},${y(0)} ${pts} ${x(s.length-1)},${y(0)}" fill="#e7c9dc"/><polyline points="${pts}" fill="none" stroke="#6b2d5c" stroke-width="2.5"/>
  ${s.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.rev)}" r="4" fill="#6b2d5c"><title>${d.date}: ${money(d.rev)}, ${d.n} orders</title></circle>${i%step?'':`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6e5668">${d.date.slice(5)}</text>`}`).join('')}</svg>`;
}
function hourChart(c){
  const a=7,b=18,W=600,H=180,L=10,B=24,T=8,v=c.slice(a,b+1),mx=Math.max(1,...v),bw=(W-L)/v.length;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Orders by hour" style="width:100%">${v.map((n,i)=>{const h=(H-T-B)*n/mx;return `<rect x="${L+i*bw+4}" y="${H-B-h}" width="${bw-8}" height="${h}" rx="3" fill="#a63d6f"><title>${hr12(a+i)}: ${n} orders</title></rect><text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6e5668">${hr12(a+i)}</text>`}).join('')}</svg>`;
}
 
/* ---------- Customer view ---------- */
function customer(){
  const shown=MENU.filter(m=>!m.al.some(a=>hide.includes(a))),ids=Object.keys(cart),total=ids.reduce((t,i)=>t+item(i).price*cart[i],0);
  const cartHTML=last?`<div class="panel confirm" role="status"><p>Order placed. Your number is</p><div class="num">#${last.id}</div>
    <p>Thanks, ${last.name}! Pay at the counter: <b>${money(last.total)}</b></p><button class="btn" onclick="last=null;render()">Order something else</button></div>`
  :`<div class="panel cart"><h2>Your order</h2>
    ${ids.length?ids.map(i=>`<div class="line"><span>${cart[i]} × ${item(i).name}</span><span>${money(item(i).price*cart[i])}</span></div>`).join(''):'<p class="empty">Tap "Add" on anything you like.</p>'}
    <div class="total">Total ${money(total)}</div><label for="nm">Name or table number</label>
    <input id="nm" value="${name.replace(/"/g,'&quot;')}" oninput="name=this.value" placeholder="e.g. Table 4">
    <button class="btn full" ${ids.length?'':'disabled'} onclick="place()">Place order</button><p class="note">Pay at the counter when you pick up.</p></div>`;
  return `<h2 class="lead">Fresh today</h2><p class="sub">Order from your phone. Allergens are listed on every item.</p>
  <div class="chips"><span>Hide anything with:</span>${ALLERGENS.map(a=>`<button class="chip ${hide.includes(a)?'on':''}" aria-pressed="${hide.includes(a)}" onclick="toggleHide('${a}')">${a}</button>`).join('')}</div>
  <div class="layout"><div class="grid">${shown.length?shown.map(m=>{
    const n=cart[m.id]||0,ok=canMake(m,n+1);
    return `<article class="item"><div class="pic" style="background:${m.bg}" aria-hidden="true">${m.e}</div><div class="body">
    <div class="row"><h3>${m.name}</h3><span class="price">${money(m.price)}</span></div><p class="ing">${m.ing}</p>
    <div class="tags">${m.al.length?m.al.map(a=>`<span class="tag">contains ${a}</span>`).join(''):'<span class="tag free">no common allergens</span>'}</div>
    <div style="margin-top:auto">${n?`<div class="qty"><button aria-label="Remove one ${m.name}" onclick="add('${m.id}',-1)">−</button><b>${n}</b><button aria-label="Add one ${m.name}" onclick="add('${m.id}',1)" ${ok?'':'disabled'}>+</button></div>`
    :`<button class="btn full" ${ok?'':'disabled'} onclick="add('${m.id}',1)">${ok?'Add':'Sold out'}</button>`}</div></div></article>`}).join(''):'<p class="empty">Everything on the menu has one of those allergens. Clear a filter to see more.</p>'}</div>${cartHTML}</div>`;
}
 
/* ---------- Grandma's dashboard ---------- */
function grandma(){
  const O=S.orders,tk=dkey(Date.now()),yk=dkey(Date.now()-864e5);
  const series=[...Array(days)].map((_,i)=>{const date=dkey(Date.now()-(days-1-i)*864e5),os=O.filter(o=>dkey(o.t)===date);return{date,n:os.length,rev:os.reduce((s,o)=>s+o.total,0)}});
  const inRange=O.filter(o=>o.t>=Date.now()-days*864e5);
  const today=series.at(-1),prev=series.at(-2)||{rev:0,n:0},delta=today.rev-prev.rev;
  const totRev=series.reduce((s,d)=>s+d.rev,0),totN=series.reduce((s,d)=>s+d.n,0),aov=totN?totRev/totN:0;
  const hrs=totN*MIN_PER_ORDER/60,labor=hrs*WAGE,waste=totRev*WASTE_RATE;
  const pending=O.filter(o=>!o.done).sort((a,b)=>a.t-b.t),recent=O.filter(o=>o.done).sort((a,b)=>b.t-a.t).slice(0,6);
  const low=Object.keys(ING).filter(k=>S.inv[k]<=ING[k][2]*LOW);
  const counts={};inRange.forEach(o=>{for(const i in o.items)counts[i]=(counts[i]||0)+o.items[i]});
  const best=MENU.map(m=>[m,counts[m.id]||0]).sort((a,b)=>b[1]-a[1]),top=Math.max(1,best[0][1]);
  const byHour=Array(24).fill(0);inRange.forEach(o=>byHour[new Date(o.t).getHours()]++);
  const itemsText=o=>Object.entries(o.items).map(([i,q])=>q+' × '+item(i).name).join(', ');
  return `<h2 class="lead">Today at the shop</h2><p class="sub">Updates when customers order. Open the customer menu in another tab to try it.</p>
  ${low.length?`<div class="alert" role="alert">Running low: ${low.map(k=>`${ING[k][0]} (${Math.round(S.inv[k])}${ING[k][1]} left)`).join(', ')}. Restock below.</div>`:''}
  <div class="stats">
    <div class="stat">Sales today<b>${money(today.rev)}</b>${delta>=0?'+':'−'}${money(Math.abs(delta))} vs yesterday</div>
    <div class="stat">Orders today<b>${today.n}</b>${pending.length} waiting right now</div>
    <div class="stat">Average order<b>${money(aov)}</b>over the last ${days} days</div>
    <div class="stat save">Time saved<b>${hrs.toFixed(1)} hrs</b>over ${days} days of orders</div>
    <div class="stat save">Money saved<b>${money(labor+waste)}</b>${money(labor)} labor + ${money(waste)} less waste</div></div>
  <section class="panel"><div class="row"><h2>Sales over time</h2><div class="chips">${[7,14].map(d=>`<button class="chip ${d===days?'on':''}" onclick="setDays(${d})">${d} days</button>`).join('')}</div></div>${areaChart(series)}</section>
  <div class="cols"><section class="panel"><h2>Orders to make (${pending.length})</h2>
    ${pending.length?pending.map(o=>`<div class="order ${ago(o.t)>10?'late':''}"><div><b>#${o.id} · ${o.name}</b><small>${itemsText(o)}</small><small>${ago(o.t)} min ago · ${money(o.total)}${ago(o.t)>10?' · waiting a while':''}</small></div><button class="btn sm" onclick="setDone(${o.id},true)">Mark ready</button></div>`).join(''):'<p class="empty">All caught up. New orders appear here.</p>'}
    ${recent.length?`<h3 class="mini">Recently finished</h3>${recent.map(o=>`<div class="order done"><div><b>#${o.id} · ${o.name}</b><small>${money(o.total)}</small></div><button class="btn sm alt" onclick="setDone(${o.id},false)">Undo</button></div>`).join('')}`:''}</section>
  <section class="panel"><h2>Inventory</h2>${Object.keys(ING).map(k=>{const [l,u,full]=ING[k],v=S.inv[k],isLow=v<=full*LOW;
    return `<div class="inv"><div class="row"><span>${l}</span><span class="${isLow?'low-t':''}">${Math.round(v)}${u} ${isLow?`<button class="btn sm" onclick="restock('${k}')">Restock</button>`:''}</span></div><div class="bar"><i class="${isLow?'low':''}" style="width:${Math.max(2,v/full*100)}%"></i></div></div>`}).join('')}</section></div>
  <div class="cols"><section class="panel"><h2>Best sellers</h2>${best.map(([m,n])=>`<div class="bs"><span>${m.name}</span><div class="bar"><i style="width:${n/top*100}%"></i></div><b>${n}</b></div>`).join('')}</section>
  <section class="panel"><h2>Busiest hours</h2>${hourChart(byHour)}<p class="note">Bake more just before these hours.</p></section></div>
  <section class="panel"><h2>Menu QR code</h2><div class="qrrow"><div id="qr"></div><div><label for="addr">Menu address</label>
    <input id="addr" value="${addr}" onchange="addr=this.value;render()">
    <p class="note">This file stores data in this browser only, so a phone would see its own separate orders. For a shared demo, scan the QR as a visual and place orders on this laptop.</p>
    <div class="tools"><button class="btn sm" onclick="sample()">Load sample data</button><button class="btn sm alt" onclick="clearAll()">Clear all orders</button></div></div></div></section>
  <p class="note">Savings assume ${MIN_PER_ORDER} min of staff time per hand-taken order at $${WAGE}/hr, plus ${WASTE_RATE*100}% of sales in avoided waste. Edit these at the top of the script.</p>`;
}
 
/* ---------- Router ---------- */
const isG=()=>location.hash.startsWith('#/grandma');
function render(){
  const g=isG(),f=document.activeElement&&document.activeElement.id;
  $('#t-c').className=g?'':'on';$('#t-g').className=g?'on':'';
  $('#app').innerHTML=g?grandma():customer();
  if(g){const q=$('#qr');if(window.QRCode)new QRCode(q,{text:addr,width:128,height:128});else q.textContent='QR needs internet'}
  if(f==='nm'){const el=$('#nm');el.focus();el.setSelectionRange(el.value.length,el.value.length)}
}
window.addEventListener('hashchange',render);
window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}});
setInterval(()=>{if(isG()&&!(document.activeElement&&document.activeElement.tagName==='INPUT')){load();render()}},10000); // refresh "x min ago"
render();
</script>
</body>
</html>
