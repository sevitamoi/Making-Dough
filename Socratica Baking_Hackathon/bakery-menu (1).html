<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakery Menu Info</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#2f666b; --card:#e8ffc8; --pic:#f9de70; --ink:#111;
  --font:"Montserrat","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);padding:16px}
header{max-width:1100px;margin:0 auto 20px;text-align:center;color:var(--card)}
h1{font-size:1.6rem;font-weight:800;margin:0 0 12px}
.langs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.langs button{font:inherit;font-weight:600;padding:10px 16px;border-radius:999px;border:2px solid var(--card);background:transparent;color:var(--card);cursor:pointer;min-height:44px}
.langs button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.langs button:focus-visible{outline:3px solid var(--pic);outline-offset:2px}
main{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.card{background:var(--card);border-radius:28px;padding:22px 20px 24px;display:flex;flex-direction:column;gap:16px}
.title{display:flex;align-items:center;gap:10px}
.title::before,.title::after{content:"";flex:1;height:3px;background:var(--ink)}
.title h2{margin:0;font-size:1.5rem;font-weight:800;text-align:center;line-height:1.15}
.pic{background:var(--pic);border-radius:24px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;padding:6%}
.pic span{transform:rotate(-20deg);font-size:1.1rem}
hr{border:0;border-top:3px solid var(--ink);margin:0;width:100%}
.info{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:420px){.info{grid-template-columns:1fr}}
h3{margin:0 0 6px;font-size:1.05rem;font-weight:800}
.ing p{margin:0;font-size:.95rem;line-height:1.5}
.nut dl{margin:0}
.nut .row{display:flex;gap:12px;font-size:.95rem;line-height:1.7}
.nut dd{margin:0;min-width:4.5em;font-weight:600}
.nut dt{font-weight:400}
.note{font-size:.75rem;margin:2px 0 0}
.allergens ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.allergens li{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px 4px 8px;font-size:.9rem;font-weight:600}
.allergens li span[aria-hidden]{font-size:1.2rem}
</style>
</head>
<body>
<header>
  <h1 id="page-title">Bakery Menu</h1>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
</header>
<main id="cards"></main>

/* ===== END EDITABLE DATA ===== */

const NUT_ORDER = ["cal","sugar","fiber","fat","sodium"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(lang){
  const t = UI[lang];
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
  document.getElementById("page-title").textContent = t.title;
  document.title = t.title;
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("cards").innerHTML = ITEMS.map(it => `
    <article class="card" aria-labelledby="h-${it.id}">
      <div class="title"><h2 id="h-${it.id}">${esc(it.name[lang])}</h2></div>
      <div class="pic">${it.image ? `<img src="${esc(it.image)}" alt="${esc(it.name[lang])}">` : `<span>${esc(t.pic)}</span>`}</div>
      <hr>
      <div class="info">
        <section class="ing"><h3>${esc(t.ing)}</h3><p>${esc(it.ingredients[lang])}</p></section>
        <section class="nut"><h3>${esc(t.nut)}</h3>
          <dl>${NUT_ORDER.map(k => `<div class="row"><dd>${esc(it.nutrition[k])}</dd><dt>${esc(t.n[k])}</dt></div>`).join("")}</dl>
          <p class="note">${esc(t.serving)}</p>
        </section>
      </div>
      <section class="allergens"><h3>${esc(t.all)}</h3>
        <ul>${it.allergens.map(a => `<li><span aria-hidden="true">${ALLERGENS[a].icon}</span>${esc(ALLERGENS[a][lang])}</li>`).join("")}</ul>
      </section>
    </article>`).join("");
  try{ localStorage.setItem("bakery-lang", lang); }catch(e){}
}

const langBox = document.getElementById("langs");
Object.keys(UI).forEach(code => {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.lang = code; b.textContent = UI[code].name;
  b.setAttribute("lang", code === "zh" ? "zh-Hans" : code);
  b.addEventListener("click", () => render(code));
  langBox.appendChild(b);
});

let start = "en";
try{ const s = localStorage.getItem("bakery-lang"); if(s && UI[s]) start = s; }catch(e){}
render(start);
</script>

</html>
